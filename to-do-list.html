<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    /* ── Tokens ── */
    :root {
      --bg:       #f5f5f0;
      --card:     #ffffff;
      --border:   #eeeeee;
      --row-bg:   #fafafa;
      --text:     #1a1a1a;
      --muted:    #999999;
      --faint:    #cccccc;
      --accent:   #2c2c2c;
      --accent-h: #444444;
      --check:    #7ec88a;
      --del-h:    #e57373;
      --del-bg:   #fdf0f0;
      --shadow:   0 4px 32px rgba(0,0,0,.07);
      --pomodoro: #e57373;
      --pom-soft: #fdf0f0;
    }
    [data-theme="dark"] {
      --bg:       #18181b;
      --card:     #27272a;
      --border:   #3f3f46;
      --row-bg:   #2f2f33;
      --text:     #f4f4f5;
      --muted:    #71717a;
      --faint:    #52525b;
      --accent:   #e4e4e7;
      --accent-h: #ffffff;
      --check:    #7ec88a;
      --del-h:    #f87171;
      --del-bg:   #3f1f1f;
      --shadow:   0 4px 32px rgba(0,0,0,.35);
      --pomodoro: #f87171;
      --pom-soft: #3f1f1f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 80px;
      transition: background .25s, color .25s;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 30px;
      transition: background .25s, box-shadow .25s;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .greeting {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .greeting h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .greeting h1 span {
      color: var(--check);
    }

    #btnEditName {
      border: none;
      background: none;
      cursor: pointer;
      font-size: .85rem;
      color: var(--muted);
      transition: color .15s;
      padding: 2px 4px;
    }
    #btnEditName:hover { color: var(--text); }

    /* Theme toggle */
    .theme-toggle {
      border: 1.5px solid var(--border);
      background: none;
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: .78rem;
      color: var(--text);
      transition: border-color .2s, background .2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .theme-toggle:hover { background: var(--row-bg); }

    /* Date */
    .subline {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* ── Pomodoro ── */
    .pom-section {
      background: var(--pom-soft);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .pom-clock {
      font-size: 1.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--pomodoro);
      min-width: 72px;
    }

    .pom-info {
      flex: 1;
    }

    .pom-info .pom-label {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .pom-info .pom-phase {
      font-size: .85rem;
      font-weight: 600;
      color: var(--pomodoro);
    }

    .pom-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .pom-btn {
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: .9rem;
      color: var(--text);
      transition: background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .pom-btn:hover { background: var(--row-bg); }

    #btnPomSettings {
      font-size: .75rem;
      width: auto;
      padding: 0 8px;
      color: var(--muted);
    }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 15px;
      font-size: .9rem;
      outline: none;
      background: var(--row-bg);
      color: var(--text);
      transition: border-color .2s, background .2s;
    }
    .input-row input::placeholder { color: var(--faint); }
    .input-row input:focus { border-color: var(--check); background: var(--card); }

    .btn-add {
      border: none;
      background: var(--accent);
      color: var(--card);
      border-radius: 12px;
      padding: 11px 17px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background .2s, transform .1s;
      line-height: 1;
    }
    .btn-add:hover { background: var(--accent-h); }
    .btn-add:active { transform: scale(.95); }

    /* Duplicate toast */
    .dup-toast {
      font-size: .78rem;
      color: var(--del-h);
      margin: -12px 0 14px;
      padding-left: 4px;
      display: none;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    /* ── Toolbar: filter + sort ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters { display: flex; gap: 5px; }

    .filter-btn {
      border: none;
      background: none;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 11px;
      border-radius: 20px;
      transition: background .2s, color .2s;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { background: var(--accent); color: var(--card); }

    .sort-select {
      border: 1.5px solid var(--border);
      background: var(--row-bg);
      color: var(--text);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: .78rem;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
    }
    .sort-select:focus { border-color: var(--check); }

    /* ── Task list ── */
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      background: var(--row-bg);
      border: 1.5px solid var(--border);
      transition: opacity .2s, border-color .2s, background .2s;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }

    .task-item.done { opacity: .45; }

    .checkbox {
      width: 20px; height: 20px; min-width: 20px;
      border-radius: 6px;
      border: 2px solid var(--faint);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      font-size: .7rem;
      color: #fff;
    }
    .task-item.done .checkbox { background: var(--check); border-color: var(--check); }

    .task-text {
      flex: 1;
      font-size: .88rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--faint); }

    .btn-delete {
      border: none; background: none;
      color: var(--faint);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 6px;
      transition: color .2s, background .2s;
      line-height: 1;
    }
    .btn-delete:hover { color: var(--del-h); background: var(--del-bg); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 30px 0;
      color: var(--faint);
      font-size: .85rem;
      display: none;
    }
    .empty span { display: block; font-size: 1.8rem; margin-bottom: 6px; }

    /* ── Footer ── */
    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .77rem;
      color: var(--muted);
    }

    .btn-clear {
      border: none; background: none;
      font-size: .77rem; color: var(--faint); cursor: pointer;
      transition: color .2s;
    }
    .btn-clear:hover { color: var(--del-h); }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn .15s ease;
    }
    .modal {
      background: var(--card);
      border-radius: 18px;
      padding: 28px 26px;
      width: 100%; max-width: 340px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      animation: popIn .2s ease;
    }
    @keyframes popIn { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }

    .modal h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--text);
    }

    .modal label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .modal input[type="text"],
    .modal input[type="number"] {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 13px;
      font-size: .9rem;
      background: var(--row-bg);
      color: var(--text);
      outline: none;
      margin-bottom: 14px;
      transition: border-color .2s;
    }
    .modal input:focus { border-color: var(--check); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-cancel {
      border: 1.5px solid var(--border);
      background: none;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 18px;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-cancel:hover { background: var(--row-bg); }

    .btn-save {
      border: none;
      background: var(--accent);
      color: var(--card);
      border-radius: 10px;
      padding: 9px 18px;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-save:hover { background: var(--accent-h); }
  </style>
</head>
<body>
<div class="card">

  <!-- Top bar -->
  <div class="topbar">
    <div class="greeting">
      <h1>Halo, <span id="greetName">Kamu</span> 👋</h1>
      <button id="btnEditName" title="Ubah nama">✏️</button>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
  </div>

  <div class="subline" id="dateLabel"></div>

  <!-- Pomodoro -->
  <div class="pom-section">
    <div class="pom-clock" id="pomClock">25:00</div>
    <div class="pom-info">
      <div class="pom-label">Pomodoro Timer</div>
      <div class="pom-phase" id="pomPhase">Fokus</div>
    </div>
    <div class="pom-controls">
      <button class="pom-btn" id="btnPomStart" title="Start/Pause">▶</button>
      <button class="pom-btn" id="btnPomReset" title="Reset">↺</button>
      <button class="pom-btn" id="btnPomSettings" title="Atur waktu">⚙</button>
    </div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Tambah tugas baru…" autocomplete="off" />
    <button class="btn-add" onclick="addTask()" title="Tambah">+</button>
  </div>
  <div class="dup-toast" id="dupToast">⚠ Tugas ini sudah ada dalam daftar.</div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Semua</button>
      <button class="filter-btn" onclick="setFilter('active',this)">Aktif</button>
      <button class="filter-btn" onclick="setFilter('done',this)">Selesai</button>
    </div>
    <select class="sort-select" id="sortSelect" onchange="render()">
      <option value="newest">Terbaru</option>
      <option value="oldest">Terlama</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="active-first">Aktif dulu</option>
      <option value="done-first">Selesai dulu</option>
    </select>
  </div>

  <!-- List -->
  <ul class="task-list" id="taskList"></ul>
  <div class="empty" id="emptyState">
    <span>✦</span>Belum ada tugas di sini.
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="countLabel"></span>
    <button class="btn-clear" onclick="clearDone()">Hapus selesai</button>
  </div>
</div>

<!-- Modal: Edit Name -->
<div class="overlay" id="modalName" style="display:none">
  <div class="modal">
    <h2>Nama Kamu</h2>
    <label for="nameInput">Masukkan nama yang ingin ditampilkan</label>
    <input type="text" id="nameInput" placeholder="e.g. Hisham" maxlength="30" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalName')">Batal</button>
      <button class="btn-save" onclick="saveName()">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal: Pomodoro Settings -->
<div class="overlay" id="modalPom" style="display:none">
  <div class="modal">
    <h2>Atur Pomodoro</h2>
    <label for="pomFocusInput">Waktu Fokus (menit)</label>
    <input type="number" id="pomFocusInput" min="1" max="120" value="25" />
    <label for="pomBreakInput">Waktu Istirahat (menit)</label>
    <input type="number" id="pomBreakInput" min="1" max="60" value="5" />
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalPom')">Batal</button>
      <button class="btn-save" onclick="savePomSettings()">Simpan</button>
    </div>
  </div>
</div>

<script>
  /* ─────────────── State ─────────────── */
  let tasks  = JSON.parse(localStorage.getItem('kiro-tasks')  || '[]');
  let filter = 'all';

  let settings = JSON.parse(localStorage.getItem('kiro-settings') || JSON.stringify({
    name:      'Kamu',
    theme:     'light',
    pomFocus:  25,
    pomBreak:  5
  }));

  /* ─────────────── Init ─────────────── */
  applyTheme(settings.theme);
  document.getElementById('greetName').textContent = settings.name;
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('id-ID', {
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });

  function saveSettings() {
    localStorage.setItem('kiro-settings', JSON.stringify(settings));
  }

  /* ─────────────── Theme ─────────────── */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('themeToggle');
    btn.textContent = t === 'dark' ? '☀ Light' : '🌙 Dark';
  }

  document.getElementById('themeToggle').addEventListener('click', () => {
    settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme(settings.theme);
    saveSettings();
  });

  /* ─────────────── Name modal ─────────────── */
  document.getElementById('btnEditName').addEventListener('click', () => {
    document.getElementById('nameInput').value = settings.name === 'Kamu' ? '' : settings.name;
    openModal('modalName');
  });

  function saveName() {
    const val = document.getElementById('nameInput').value.trim();
    settings.name = val || 'Kamu';
    document.getElementById('greetName').textContent = settings.name;
    saveSettings();
    closeModal('modalName');
  }

  /* ─────────────── Pomodoro ─────────────── */
  let pomSeconds  = settings.pomFocus * 60;
  let pomRunning  = false;
  let pomInterval = null;
  let pomIsBreak  = false;

  function pomDisplay() {
    const m = String(Math.floor(pomSeconds / 60)).padStart(2,'0');
    const s = String(pomSeconds % 60).padStart(2,'0');
    document.getElementById('pomClock').textContent = m + ':' + s;
    document.getElementById('pomPhase').textContent = pomIsBreak ? 'Istirahat' : 'Fokus';
  }

  document.getElementById('btnPomStart').addEventListener('click', () => {
    if (pomRunning) {
      clearInterval(pomInterval);
      pomRunning = false;
      document.getElementById('btnPomStart').textContent = '▶';
    } else {
      pomInterval = setInterval(() => {
        pomSeconds--;
        if (pomSeconds <= 0) {
          clearInterval(pomInterval);
          pomRunning = false;
          document.getElementById('btnPomStart').textContent = '▶';
          pomIsBreak = !pomIsBreak;
          pomSeconds = pomIsBreak ? settings.pomBreak * 60 : settings.pomFocus * 60;
          pomDisplay();
          // Simple beep via Web Audio
          try {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = pomIsBreak ? 440 : 880;
            gain.gain.setValueAtTime(.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .8);
            osc.start(); osc.stop(ctx.currentTime + .8);
          } catch(e) {}
          return;
        }
        pomDisplay();
      }, 1000);
      pomRunning = true;
      document.getElementById('btnPomStart').textContent = '⏸';
    }
  });

  document.getElementById('btnPomReset').addEventListener('click', () => {
    clearInterval(pomInterval);
    pomRunning = false;
    pomIsBreak = false;
    pomSeconds = settings.pomFocus * 60;
    document.getElementById('btnPomStart').textContent = '▶';
    pomDisplay();
  });

  document.getElementById('btnPomSettings').addEventListener('click', () => {
    document.getElementById('pomFocusInput').value = settings.pomFocus;
    document.getElementById('pomBreakInput').value = settings.pomBreak;
    openModal('modalPom');
  });

  function savePomSettings() {
    const f = parseInt(document.getElementById('pomFocusInput').value) || 25;
    const b = parseInt(document.getElementById('pomBreakInput').value) || 5;
    settings.pomFocus = Math.max(1, Math.min(120, f));
    settings.pomBreak = Math.max(1, Math.min(60,  b));
    saveSettings();
    // Reset timer with new values
    clearInterval(pomInterval);
    pomRunning = false;
    pomIsBreak = false;
    pomSeconds = settings.pomFocus * 60;
    document.getElementById('btnPomStart').textContent = '▶';
    pomDisplay();
    closeModal('modalPom');
  }

  pomDisplay();

  /* ─────────────── Tasks ─────────────── */
  function saveTasks() {
    localStorage.setItem('kiro-tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text  = input.value.trim();
    if (!text) return;

    // Duplicate check (case-insensitive)
    const dup = tasks.some(t => t.text.toLowerCase() === text.toLowerCase());
    if (dup) {
      showDupToast();
      return;
    }

    tasks.unshift({ text, done: false, createdAt: Date.now() });
    input.value = '';
    hideDupToast();
    saveTasks();
    render();
  }

  function showDupToast() {
    const t = document.getElementById('dupToast');
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(hideDupToast, 3000);
  }

  function hideDupToast() {
    document.getElementById('dupToast').style.display = 'none';
  }

  function toggle(idx) {
    tasks[idx].done = !tasks[idx].done;
    saveTasks(); render();
  }

  function remove(idx) {
    tasks.splice(idx, 1);
    saveTasks(); render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    saveTasks(); render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function getSorted(arr) {
    const sort = document.getElementById('sortSelect').value;
    const copy = [...arr];
    switch(sort) {
      case 'oldest':      return copy.sort((a,b) => a.createdAt - b.createdAt);
      case 'az':          return copy.sort((a,b) => a.text.localeCompare(b.text));
      case 'za':          return copy.sort((a,b) => b.text.localeCompare(a.text));
      case 'active-first':return copy.sort((a,b) => a.done - b.done);
      case 'done-first':  return copy.sort((a,b) => b.done - a.done);
      default:            return copy.sort((a,b) => b.createdAt - a.createdAt); // newest
    }
  }

  function render() {
    const list   = document.getElementById('taskList');
    const empty  = document.getElementById('emptyState');
    const count  = document.getElementById('countLabel');

    const visible = getSorted(
      tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done')   return  t.done;
        return true;
      })
    );

    list.innerHTML = '';

    visible.forEach(task => {
      const realIdx = tasks.indexOf(task);
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      const check = document.createElement('div');
      check.className = 'checkbox';
      check.innerHTML = task.done ? '✓' : '';
      check.onclick = () => toggle(realIdx);

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'btn-delete';
      del.innerHTML = '&times;';
      del.title = 'Hapus';
      del.onclick = () => remove(realIdx);

      li.append(check, text, del);
      list.appendChild(li);
    });

    const activeCount = tasks.filter(t => !t.done).length;
    empty.style.display   = visible.length === 0 ? 'block' : 'none';
    count.textContent     = activeCount + ' tugas tersisa';
  }

  /* ─────────────── Modal helpers ─────────────── */
  function openModal(id)  { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  // Close on backdrop click
  document.querySelectorAll('.overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
  });

  // Enter to save name
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveName();
  });

  // Enter to add task
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // Hide dup toast on new input
  document.getElementById('taskInput').addEventListener('input', hideDupToast);

  render();
</script>
</body>
</html>
